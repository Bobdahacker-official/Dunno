set timeout=2
set default=0
set gfxmode=1280x800x32,1024x768x32,auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
terminal_output gfxterm
set color_normal=light-gray/black
set color_highlight=black/light-green
menuentry "MarrowOS - local AI workspace" {
    linux /boot/bzImage root=/dev/vda rw console=tty0 console=ttyS0,115200 loglevel=3 quiet video=1280x800 init=/sbin/marrow-init
    initrd /boot/initrd.gz
}
menuentry "MarrowOS - serial and recovery console" {
    linux /boot/bzImage root=/dev/vda rw console=tty0 console=ttyS0,115200 loglevel=7 video=1280x800
    initrd /boot/initrd.gz
}
